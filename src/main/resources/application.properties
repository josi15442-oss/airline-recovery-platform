spring.application.name=airline-recovery-platform

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/airline_recovery}
spring.datasource.username=${DB_USERNAME:airline}
spring.datasource.password=${DB_PASSWORD:airline123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka Consumer
spring.kafka.consumer.group-id=airline-recovery-group
spring.kafka.consumer.auto-offset-reset=latest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.airline.recovery.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.airline.recovery.event.FlightDisruptedEvent